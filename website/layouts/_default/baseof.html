<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-{{ .Section | default "home" }}">
  <a href="#main" class="skip-link">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ if eq .Kind "page" }}
  <div class="container content-narrow">
    <a href="#main" class="back-to-top">↑ Back to top</a>
  </div>
  {{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
