{{ define "main" }}
<style>
/* ── Database page layout ──────────────────────────────── */
#db-page {
  display: flex;
  height: calc(100vh - var(--nav-height));
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-mono);
}

/* ── Left Sidebar: Search & Filters ───────────────────── */
#db-sidebar {
  width: 320px;
  min-width: 320px;
  display: flex;
  flex-direction: column;
  background: var(--paper-deep);
  border-right: 1px solid var(--ink);
  overflow: hidden;
}

#db-sidebar-top {
  padding: 1rem;
  border-bottom: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  flex-shrink: 0;
}

/* Tabs */
.db-tabs {
  display: flex;
  border: 1px solid var(--ink);
  border-radius: 2px;
  overflow: hidden;
  background: var(--paper);
}

.db-tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.5rem;
  transition: all 0.1s ease;
  outline: none;
}

.db-tab-btn:hover {
  background: rgba(26, 22, 20, 0.05);
  color: var(--ink);
}

.db-tab-btn.active {
  background: var(--accent);
  color: var(--paper);
}

/* Search input */
.search-wrap {
  position: relative;
}

#db-search {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 0.5rem 0.75rem;
  outline: none;
}

#db-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* Filters */
#db-filters {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

#db-filters::-webkit-scrollbar { width: 4px; }
#db-filters::-webkit-scrollbar-track { background: transparent; }
#db-filters::-webkit-scrollbar-thumb { background: var(--ink-muted); border-radius: 2px; }

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.filter-group label {
  font-family: var(--font-display);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-weight: 700;
}

.filter-select, .filter-input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.35rem 0.5rem;
  outline: none;
}

.filter-select:focus, .filter-input:focus {
  border-color: var(--accent);
}

/* Range input */
.range-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.range-val {
  font-size: 0.75rem;
  min-width: 45px;
  text-align: right;
}

input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}

/* List Results */
#db-results-container {
  flex: 1;
  border-top: 1px solid var(--ink);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

#db-results-container::-webkit-scrollbar { width: 4px; }
#db-results-container::-webkit-scrollbar-track { background: transparent; }
#db-results-container::-webkit-scrollbar-thumb { background: var(--ink-muted); border-radius: 2px; }

.result-item {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid rgba(26, 22, 20, 0.1);
  cursor: pointer;
  transition: all 0.1s;
}

.result-item:hover {
  background: var(--paper);
}

.result-item.active {
  background: var(--paper);
  border-left: 4px solid var(--accent);
  padding-left: calc(1rem - 4px);
}

.result-name {
  font-family: var(--font-display);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.result-item:hover .result-name, .result-item.active .result-name {
  color: var(--accent);
}

.result-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.65rem;
  color: var(--ink-muted);
}

.result-vnum {
  font-family: var(--font-mono);
}

/* ── Right Panel: Details ──────────────────────────────── */
#db-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--paper);
  position: relative;
}

#db-content {
  flex: 1;
  overflow-y: auto;
  padding: 2rem;
}

#db-content::-webkit-scrollbar { width: 6px; }
#db-content::-webkit-scrollbar-track { background: transparent; }
#db-content::-webkit-scrollbar-thumb { background: var(--ink-muted); border-radius: 3px; }

/* Empty state */
#db-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--ink-muted);
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.9rem;
  gap: 0.5rem;
  pointer-events: none;
}

/* Detail UI elements */
.detail-card {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.detail-header {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 1rem;
}

.detail-short {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--accent);
  margin: 0 0 0.5rem 0;
  line-height: 1.1;
}

.detail-long {
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-style: italic;
  color: var(--ink);
  margin: 0;
  line-height: 1.4;
}

/* Grid Layout */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}

.detail-section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.detail-section h3 {
  font-family: var(--font-display);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--ink);
  padding-bottom: 0.25rem;
  margin: 0;
}

/* Table stats */
.stats-table {
  width: 100%;
  border-collapse: collapse;
}

.stats-table tr {
  border-bottom: 1px solid rgba(26, 22, 20, 0.1);
}
.stats-table tr:last-child {
  border-bottom: none;
}

.stats-table td {
  padding: 0.4rem 0;
  font-size: 0.75rem;
}

.stats-table td.label {
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  font-size: 0.65rem;
}

.stats-table td.val {
  text-align: right;
  font-family: var(--font-mono);
  font-weight: 700;
}

/* Descriptions */
.detail-desc-block {
  background: var(--paper-deep);
  border: 1px solid var(--ink);
  border-radius: 2px;
  padding: 1rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* Relations links lists */
.rel-list {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.rel-item {
  font-size: 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.25rem 0.5rem;
  background: var(--paper-deep);
  border: 1px solid rgba(26, 22, 20, 0.08);
  border-radius: 2px;
}

.rel-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
}
.rel-link:hover {
  text-decoration: underline;
}

.rel-meta {
  font-size: 0.65rem;
  color: var(--ink-muted);
  font-family: var(--font-mono);
}

/* ── Stat SVG Vis ─────────────────────────────────────── */
.stat-vis-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0.5rem;
  background: var(--paper-deep);
  border: 1px solid var(--ink);
  border-radius: 2px;
  height: 200px;
}

.vis-bar-row {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  margin-bottom: 0.5rem;
}
.vis-bar-label {
  font-family: var(--font-display);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.vis-bar-bg {
  height: 8px;
  background: rgba(26, 22, 20, 0.08);
  border: 1px solid var(--ink);
  border-radius: 1px;
  overflow: hidden;
}
.vis-bar-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease-out;
}

/* Loading */
#db-loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  z-index: 10;
  color: var(--ink-muted);
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.85rem;
  gap: 1rem;
}

#db-progress-wrap {
  width: 200px;
  height: 3px;
  background: rgba(26, 22, 20, 0.12);
  border-radius: 2px;
  overflow: hidden;
}
#db-progress-bar {
  height: 100%;
  width: 40%;
  background: var(--accent);
  border-radius: 2px;
  animation: progress-sweep 1.6s ease-in-out infinite;
}

@keyframes progress-sweep {
  0%   { transform: translateX(-150%) scaleX(0.4); }
  50%  { transform: translateX(100%) scaleX(0.8); }
  100% { transform: translateX(400%) scaleX(0.4); }
}

/* Responsive */
@media (max-width: 900px) {
  #db-page {
    flex-direction: column;
  }
  #db-sidebar {
    width: 100%;
    min-width: 100%;
    height: 40%;
    border-right: none;
    border-bottom: 1px solid var(--ink);
  }
  #db-main {
    height: 60%;
  }
}
</style>

<!-- Editorial masthead -->
<div style="padding: 2rem 2rem 0; max-width: 800px; margin: 0 auto;">
  <div style="font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin-bottom: 0.25rem;">№ 003 · Knowledge Codex</div>
  <h1 style="font-family: var(--font-display); font-size: 2.4rem; color: var(--accent); margin: 0 0 0.5rem 0; line-height: 1.1;">The codex.</h1>
  <div style="font-family: var(--font-body); font-size: 0.95rem; color: var(--ink-muted); margin-bottom: 1rem; font-style: italic;">Every mob, every object — cross-referenced, searchable, indexed.</div>
</div>

<div id="db-page">

  <!-- Sidebar: tab selector + search + filters + list results -->
  <aside id="db-sidebar">
    <div id="db-sidebar-top">
      <div class="db-tabs">
        <button class="db-tab-btn active" id="tab-mobs" data-tab="mobs">Mobs <span id="mob-count" style="opacity:0.7;"></span></button>
        <button class="db-tab-btn" id="tab-items" data-tab="items">Items <span id="item-count" style="opacity:0.7;"></span></button>
      </div>
      <div class="search-wrap">
        <input id="db-search" type="text" placeholder="Search mobs by name or VNUM…" autocomplete="off" aria-label="Search database">
      </div>
    </div>
    
    <!-- Collapsible filters based on Active Tab -->
    <div id="db-filters">
      <!-- Mob Filters -->
      <div id="filter-mobs-section" class="filter-tab-section">
        <div class="filter-group">
          <label for="filter-mob-level">Minimum Level</label>
          <div class="range-wrap">
            <input type="range" id="filter-mob-level" min="0" max="40" value="0">
            <span class="range-val" id="filter-mob-level-val">0</span>
          </div>
        </div>
        <div class="filter-group" style="margin-top: 0.5rem;">
          <label for="filter-mob-align">Alignment</label>
          <select id="filter-mob-align" class="filter-select">
            <option value="all">All Alignments</option>
            <option value="good">Good (Positive)</option>
            <option value="neutral">Neutral (Around 0)</option>
            <option value="evil">Evil (Negative)</option>
          </select>
        </div>
      </div>
      
      <!-- Item Filters (Hidden initially) -->
      <div id="filter-items-section" class="filter-tab-section" style="display:none;">
        <div class="filter-group">
          <label for="filter-item-type">Item Type</label>
          <select id="filter-item-type" class="filter-select">
            <option value="all">All Types</option>
            <option value="WEAPON">Weapons</option>
            <option value="ARMOR">Armor</option>
            <option value="CONTAINER">Containers</option>
            <option value="LIGHT">Lights</option>
            <option value="KEY">Keys</option>
            <option value="BOAT">Boats</option>
            <option value="POTION">Potions</option>
            <option value="SCROLL">Scrolls</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="filter-group" style="margin-top: 0.5rem;">
          <label for="filter-item-wear">Wear Position</label>
          <select id="filter-item-wear" class="filter-select">
            <option value="all">Any Position</option>
            <option value="WIELD">Wielded (Weapon)</option>
            <option value="BODY">Body (Armor)</option>
            <option value="HEAD">Head</option>
            <option value="SHIELD">Shield</option>
            <option value="FINGER">Finger</option>
            <option value="NECK">Neck</option>
            <option value="HANDS">Hands</option>
            <option value="HOLD">Held</option>
          </select>
        </div>
      </div>
    </div>
    
    <!-- Search / Filtered List Results -->
    <div id="db-results-container" role="listbox" aria-label="Database records">
      <!-- Filled dynamically -->
    </div>
  </aside>

  <!-- Main main canvas details -->
  <main id="db-main">
    <div id="db-content">
      <div id="db-empty">
        <div>← Select a database record to inspect</div>
      </div>
      <div id="db-detail-container" style="display:none;">
        <!-- Filled dynamically -->
      </div>
    </div>
    
    <!-- Dynamic Loading Panel -->
    <div id="db-loading">
      <div>Loading MUD Database…</div>
      <div id="db-progress-wrap">
        <div id="db-progress-bar"></div>
      </div>
    </div>
  </main>

</div>

<script src="/js/database.js?v=1"></script>
{{ end }}
