<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
<header class="archival-header">
  <!-- Centered Monolith Wordmark -->
  <div class="header-wordmark-container container">
    <div class="header-wordmark-block">
      <a href="/" class="header-wordmark-wrapper">
        <span class="header-wordmark-top">DARK</span>
        <span class="header-wordmark-bottom">PAWNS</span>
      </a>
      <div class="header-wordmark-hairline"></div>
      <div class="header-wordmark-dossier">
        <span>A MULTI-USER DUNGEON</span>
        <span class="dossier-dots">········</span>
        <span>EST. 1997</span>
      </div>
    </div>
  </div>

  <!-- Double Rule Menu Navigation -->
  <nav class="nav-ledger container" aria-label="Ledger navigation">
    <label for="nav-toggle" class="nav-hamburger" aria-label="Menu" role="button" tabindex="0">
      <span></span>
    </label>
    <ul class="nav-links">
      <li><a href="/news"{{ if eq .RelPermalink "/news/" }} class="active"{{ end }}>News</a></li>
      <li><a href="/play"{{ if eq .RelPermalink "/play/" }} class="active"{{ end }}>Play</a></li>
      <li><a href="/help"{{ if eq .RelPermalink "/help/" }} class="active"{{ end }}>Help</a></li>
      <li><a href="/map"{{ if eq .RelPermalink "/map/" }} class="active"{{ end }}>Map</a></li>
      <li><a href="/lore"{{ if eq .RelPermalink "/lore/" }} class="active"{{ end }}>Lore</a></li>
      <li><a href="/docs"{{ if eq .RelPermalink "/docs/" }} class="active"{{ end }}>Docs</a></li>
      <li><a href="/about"{{ if eq .RelPermalink "/about/" }} class="active"{{ end }}>About</a></li>
    </ul>
  </nav>
</header>
