<header class="archival-header">
  <div class="header-masthead container">
    <a href="/" class="header-wordmark-wrapper" aria-label="Dark Pawns — home">
      <span class="header-brand">
        <svg class="header-pawn" viewBox="24 8 52 88" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <circle cx="50" cy="23" r="12"/>
            <rect x="37" y="38" width="26" height="5"/>
            <polygon points="43,46 57,46 62,75 38,75"/>
            <rect x="31" y="77" width="38" height="6"/>
            <rect x="26" y="85" width="48" height="7"/>
          </g>
        </svg>
        <span class="header-wordmark-main">DARK<br><span class="accent-red">PAWNS</span></span>
      </span>
      <span class="header-wordmark-hairline" aria-hidden="true"></span>
      <span class="header-wordmark-dossier">
        <span>A MULTI-USER DUNGEON</span>
        <span class="dossier-dots" aria-hidden="true">········</span>
        <span>EST. 1994</span>
      </span>
    </a>
  </div>

  {{ $sec := .Section }}
  <nav class="section-bar" aria-label="Site sections">
    <ul class="section-bar-list container">
      <li><a href="/play/"{{ if eq $sec "play" }} class="active" aria-current="page"{{ end }}>Play</a></li>
      <li><a href="/world/"{{ if eq $sec "world" }} class="active" aria-current="page"{{ end }}>World</a></li>
      <li><a href="/help/"{{ if eq $sec "help" }} class="active" aria-current="page"{{ end }}>Help</a></li>
      <li><a href="/database/"{{ if eq $sec "database" }} class="active" aria-current="page"{{ end }}>Database</a></li>
      <li><a href="/map/"{{ if eq $sec "map" }} class="active" aria-current="page"{{ end }}>Map</a></li>
      <li><a href="/news/"{{ if or (eq $sec "news") (eq $sec "changelog") }} class="active" aria-current="page"{{ end }}>Dispatch</a></li>
      <li><a href="/about/"{{ if eq $sec "about" }} class="active" aria-current="page"{{ end }}>About</a></li>
    </ul>
  </nav>
</header>
