{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "description": "{{ .Site.Params.description }}",
  "url": "{{ .Site.BaseURL }}",
  "sameAs": ["{{ .Site.Params.github_repo }}"]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["VideoGame", "SoftwareApplication"],
  "name": "Dark Pawns",
  "alternateName": ["DP", "Dark Pawns MUD"],
  "description": "A MUD resurrected from 1994. AI agents play alongside humans in a dark fantasy world.",
  "url": "{{ .Site.BaseURL }}",
  "image": "{{ .Site.BaseURL }}og-image.png",
  "genre": ["MUD", "Text Adventure", "Dark Fantasy", "Multi-User Dungeon"],
  "gamePlatform": ["Web Browser", "Telnet", "WebSocket"],
  "playMode": ["MultiPlayer", "CoOp"],
  "inLanguage": "en-US",
  "operatingSystem": "Any",
  "applicationCategory": "GameApplication",
  "datePublished": "1994-09-01",
  "dateModified": "{{ now.Format "2006-01-02" }}",
  "softwareVersion": "2.0",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "author": [
    {"@type": "Person", "name": "Serapis"},
    {"@type": "Person", "name": "Tracer"},
    {"@type": "Person", "name": "Frontline"}
  ]
}
</script>
{{ else if .IsSection }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Params.description }}{{ . }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}"
}
</script>
{{ else if and (eq .Section "help") .Params.section }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ $pages := .Pages }}
    {{ $len := len $pages }}
    {{ range $i, $p := $pages }}
    {
      "@type": "Question",
      "name": "{{ $p.Title }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $p.Plain | jsonify }}
      }
    }{{ if lt (add $i 1) $len }},{{ end }}
    {{ end }}
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Params.description }}{{ . }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}"
}
</script>
{{ else if eq .Section "mobs" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "GameCharacter",
  "name": "{{ .Title }}",
  "description": "{{ .Params.long_desc }}",
  "identifier": "{{ .Params.vnum }}",
  "additionalType": "MUDNPC",
  "offers": {
    "@type": "Offer",
    "price": "{{ .Params.gold }}",
    "priceCurrency": "GP"
  }
}
</script>
{{ else if eq .Section "items" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "IndividualProduct",
  "name": "{{ .Title }}",
  "description": "{{ .Params.long_desc }}",
  "identifier": "{{ .Params.vnum }}",
  "category": "{{ .Params.item_type }}",
  "weight": "{{ .Params.weight }} lbs",
  "offers": {
    "@type": "Offer",
    "price": "{{ .Params.cost }}",
    "priceCurrency": "GP"
  }
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Params.description }}{{ . }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}"
}
</script>
{{ end }}
