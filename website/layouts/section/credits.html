{{ define "main" }}
<div class="container content-narrow">
  <header class="section-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>

  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

  {{ if .Pages }}
    {{ partial "section-cards.html" (dict "pages" .Pages "context" .) }}
  {{ end }}
</div>
{{ end }}
