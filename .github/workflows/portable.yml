name: Portable bundle
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/portable.yml'
      - 'cmd/darkpawns/**'
      - 'internal/portable/**'
      - 'internal/releaseauth/**'
      - 'cmd/dp-release/**'
      - 'bootstrap/**'
      - '.github/workflows/release.yml'
      - 'cmd/server/**'
      - 'pkg/**'
      - 'lib/**'
      - 'web/**'
      - 'admin-ui/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/*portable*'
      - 'scripts/test_install_entry.py'
      - 'website/static/install.sh'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Portable unit and asset-curation checks
        run: |
          go test ./internal/portable ./internal/releaseauth ./cmd/darkpawns ./cmd/dp-release
          python -m unittest discover -s scripts -p test_stage_portable_release.py
          python -m unittest discover -s scripts -p test_install_entry.py
          python -m unittest discover -s scripts -p test_publisher_key_copies.py
          node --test scripts/connection-info.test.mjs
          python -m pip install 'websockets>=12,<16'
      - name: Windows editor access adapter
        if: runner.os == 'Windows'
        run: go test ./pkg/session -run '^TestPortableWindowsEditorDelete$'
      - name: Select the native target from the shared release definition
        shell: python
        run: |
          import pathlib, subprocess
          goos = subprocess.check_output(['go', 'env', 'GOOS'], text=True).strip()
          goarch = subprocess.check_output(['go', 'env', 'GOARCH'], text=True).strip()
          config = pathlib.Path('.goreleaser.yaml').read_text()
          config = config.replace('goos: [linux, darwin, windows]', 'goos: [' + goos + ']')
          config = config.replace('goarch: [amd64, arm64]', 'goarch: [' + goarch + ']')
          pathlib.Path('.goreleaser-native.yaml').write_text(config)
      - name: Generate the disposable snapshot publisher key
        shell: python
        run: |
          import base64, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          private, public = temp / 'snapshot-private.pem', temp / 'snapshot-public.pem'
          subprocess.run(['go', 'run', './cmd/dp-release', '--generate-key', str(private), '--public', str(public)], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('DP_SNAPSHOT_PUBLISHER_KEY=' + base64.b64encode(public.read_bytes()).decode() + '\n')
              env.write(f'SNAPSHOT_PRIVATE_PEM={private}\n')
              env.write(f'SNAPSHOT_PUBLIC_PEM={public}\n')
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          # A native snapshot builds one platform only; the package channels
          # need the full archive set and never publish from snapshots.
          args: release --snapshot --clean --skip=homebrew,scoop,winget,docker --config .goreleaser-native.yaml
      - name: Extract the generated native archive and exercise the instance journey
        shell: python
        run: |
          import os, pathlib, subprocess, tarfile, zipfile
          archives = list(pathlib.Path('dist').glob('*.tar.gz')) + list(pathlib.Path('dist').glob('*.zip'))
          assert len(archives) == 1, archives
          archive = archives[0]
          destination = pathlib.Path('portable-extracted')
          destination.mkdir()
          if archive.suffix == '.zip':
              with zipfile.ZipFile(archive) as source:
                  source.extractall(destination)
          else:
              with tarfile.open(archive) as source:
                  source.extractall(destination, filter='data')
          bundles = list(destination.iterdir())
          assert len(bundles) == 1, bundles
          # Snapshot bundles are assembled without the release signing flow:
          # sign each one's per-file manifest with the disposable key the
          # launcher was linked against, so the strict bundle gate passes and
          # the smokes exercise it.
          for bundle in bundles:
              subprocess.run(['go', 'run', './cmd/dp-release', '--sign-bundle', str(bundle),
                              '--key', os.path.join(os.environ['RUNNER_TEMP'], 'snapshot-private.pem'),
                              '--public', os.path.join(os.environ['RUNNER_TEMP'], 'snapshot-public.pem')], check=True)
          subprocess.run(['python', 'scripts/portable_smoke.py', '--bundle', str(bundles[0])], check=True)
          subprocess.run(['python', 'scripts/portable_local_telnet_smoke.py', '--bundle', str(bundles[0])], check=True)
      - name: Ensure the Linux user service manager is available
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Exercise background ownership and native automatic startup
        shell: python
        run: |
          import pathlib, subprocess, sys
          bundles = list(pathlib.Path('portable-extracted').iterdir())
          assert len(bundles) == 1, bundles
          args = ['python', 'scripts/portable_lifecycle_smoke.py', '--bundle', str(bundles[0]), '--native-service']
          if sys.platform == 'linux':
              args.append('--shutdown-failure')
          subprocess.run(args, check=True)
      - name: Exercise verified updates and failed-start recovery
        shell: python
        run: |
          import pathlib, subprocess
          bundles = list(pathlib.Path('portable-extracted').iterdir())
          assert len(bundles) == 1, bundles
          subprocess.run(['python', 'scripts/portable_update_smoke.py', '--bundle', str(bundles[0]), '--native-service'], check=True)

      - name: Exercise hosted listeners and persistent system supervision
        if: runner.os == 'Linux'
        shell: python
        run: |
          import pathlib, subprocess
          bundles = list(pathlib.Path('portable-extracted').iterdir())
          assert len(bundles) == 1, bundles
          subprocess.run(['python', 'scripts/portable_hosting_smoke.py', '--bundle', str(bundles[0])], check=True)
          subprocess.run(['python', 'scripts/portable_update_smoke.py', '--bundle', str(bundles[0]), '--supervised'], check=True)
      - name: Verify signed native bootstrap installers
        shell: python
        run: |
          import pathlib, subprocess
          bundles = list(pathlib.Path('portable-extracted').iterdir())
          assert len(bundles) == 1, bundles
          subprocess.run(['python', 'scripts/portable_bootstrap_smoke.py', '--bundle', str(bundles[0])], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-portable-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
