name: Dark Pawns CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkpawns
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Go dependencies
      run: go mod download

    - name: Run Go tests with race detector
      run: go test -race -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v /tests/unit) -v -timeout 120s

    - name: Coverage report + ratchet
      run: |
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
        echo "Total statement coverage: $total"
        echo "### Go coverage: $total" >> "$GITHUB_STEP_SUMMARY"
        echo "Worst-covered functions:"
        go tool cover -func=coverage.out | sort -k3 -n | head -15 || true
        # RATCHET GATE (baseline 42.0%): fail only if coverage REGRESSES below the floor. 2-pt buffer
        # absorbs run-to-run noise; raise MIN as coverage climbs. awk exits 0 when below floor → we fail.
        MIN=40.0; num=${total%\%}
        if awk "BEGIN{exit !($num+0 < $MIN)}"; then
          echo "::error::coverage $total is below the ${MIN}% floor"; exit 1
        fi
        echo "coverage $total >= ${MIN}% floor — ok"

    # Reachability ratchet (R2/R5c): fail if the count of unreachable commands
    # (implemented-unwired + missing) rises vs the newest committed snapshot in
    # docs/reports/. The floor only moves one way. Floor as of 2026-07-22: 61.
    # Stdlib-only (~0.1s); see scripts/reachability_ci_gate.py for the set/why.
    - name: Reachability ratchet
      run: python3 scripts/reachability_ci_gate.py

    - name: Verify all packages build
      run: go build ./...
    
    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Run Python tests
      run: |
        python -m pytest tests/ -k "not e2e" -v || echo "No pytest tests found"

    - name: Build Go binary
      run: go build -o server ./cmd/server

    - name: Run e2e persistence smoke test (telnet + DB)
      env:
        DP_TEST_DB_URL: "postgres://postgres:postgres@localhost:5432/darkpawns?sslmode=disable"
        JWT_SECRET: "ci-smoke-test-secret-at-least-32-characters-long"
      run: |
        go test -race ./tests/e2e/ -run TestTelnetSmoke_PersistenceRoundTrip -v -timeout 120s

    - name: Start server for Python smoke test
      env:
        DP_TEST_DB_URL: "postgres://postgres:postgres@localhost:5432/darkpawns?sslmode=disable"
        JWT_SECRET: "ci-smoke-test-secret-at-least-32-characters-long"
      run: |
        ./server -world lib/world -port 4350 -telnet-port 0 -db "$DP_TEST_DB_URL" > server.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4350/health > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

    - name: Run Python e2e smoke test
      run: |
        pip install websockets
        python3 scripts/smoke_test_2b.py --ws-url ws://localhost:4350/ws

    - name: Stop Python smoke server
      if: always()
      run: kill $SERVER_PID 2>/dev/null || true

    - name: Print server logs on Python smoke test failure
      if: failure()
      run: |
        echo "--- server.log ---"
        cat server.log 2>/dev/null || true

    - name: Test server startup
      run: |
        timeout 10s ./server -port 9999 &
        sleep 3
        curl -f http://localhost:9999/health || echo "Health check failed but continuing"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pin to a v2.x release built with Go ≥ 1.26 so it can load the
        # go 1.26.4 toolchain declared in go.mod. The action's v6 line only
        # supports golangci-lint v1.x (built with go1.24), which fails with
        # "Go language version (go1.24) is lower than the targeted Go
        # version (1.26.4)". Match the version used locally.
        # Update coordinately with .golangci.yml (already v2-style).
        version: v2.12.2

    - name: Install gofumpt
      run: go install mvdan.cc/gofumpt@latest

    - name: Check formatting
      run: |
        # List offending files (and show a diff) before failing, so the
        # failure is self-explanatory in the Actions log instead of silent.
        set +e
        files=$(gofumpt -l .)
        if [ -n "$files" ]; then
          echo "::error::gofumpt found unformatted files:"
          echo "$files"
          echo
          echo "Proposed diff:"
          gofumpt -d .
          exit 1
        fi

    - name: Run golangci-lint
      run: golangci-lint run ./...

    - name: Check website voice
      run: python3 website-astro/scripts/voice_lint.py --quiet-warnings

    - name: Check content inventory
      run: python3 website-astro/scripts/content_inventory.py --check

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    # Cache the pinned scanner BINARIES (not the project's module cache, which
    # setup-go already handles). The scanners pull their own transitive deps
    # (x/crypto, s2a-go, openai-go, …) that are absent from this repo's go.sum,
    # so every `go install` re-fetches and re-verifies them against
    # sum.golang.org — a live network hit that intermittently fails with a 403
    # or an INTERNAL_ERROR stream reset and reddens unrelated PRs. On a cache
    # hit the install is skipped entirely (see the guards below), so the flaky
    # fetch never happens. Key is the exact tool + Go versions: bump either and
    # the cache misses and rebuilds.
    - name: Cache security tool binaries
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: sec-tools-go1.26.6-govulncheck1.7.0-gosec2.29.0

    # Supply-chain integrity: every dependency's content matches its go.sum hash. Deterministic and
    # fast; a failure means a tampered or corrupted module — always worth blocking. (Same check reek's
    # nightly govulncheck lane runs.)
    - name: go mod verify
      run: go mod verify

    # Reachable known-vulnerabilities — CVEs in code actually called, not merely present in go.sum.
    # ENFORCING: the 2026-07-22 backlog (GO-2026-5856 crypto/tls ECH → Go 1.26.5; GO-2026-5970 x/text
    # → v0.40.0) was cleared in this change. A NEW reachable vuln now blocks the merge.
    - name: govulncheck
      # Tool binary pinned (2026-08-26): the vulnerability DATABASE is still
      # fetched live at scan time, so new CVEs keep blocking merges — only the
      # scanner version is stable. Bump deliberately.
      #
      # The install is skipped when the cache already restored the binary, and
      # otherwise retried up to 3× so a transient sum.golang.org blip self-heals.
      # ONLY the install is retried — the scan runs exactly once so a real
      # reachable-vuln finding is never masked by a retry.
      run: |
        retry() { for i in 1 2 3; do "$@" && return 0; echo "install attempt $i failed; retrying in $((i*5))s"; sleep $((i*5)); done; return 1; }
        [ -x "$(go env GOPATH)/bin/govulncheck" ] || retry go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        "$(go env GOPATH)/bin/govulncheck" ./...

    # Static security scan (HIGH severity) — the same gosec lane reek's toolpass runs nightly.
    # ENFORCING: the 28 HIGH findings were triaged to zero in this change (all false positives, each
    # suppressed with a justified `#nosec`). A NEW unjustified HIGH now blocks the merge.
    - name: gosec
      # Pinned (2026-08-26): gosec@latest shipped the G703 taint rule in
      # v2.29.0 and turned every branch red repo-wide overnight. Rules are
      # compiled into the binary, so pinning freezes the rule set; bump
      # deliberately (expect new findings to need triage, like the 28 HIGH
      # ones below).
      #
      # Same pattern as govulncheck: install skipped on a cache hit, retried on
      # a miss (this is the step that has been failing on sum.golang.org stream
      # resets); the scan itself runs once so a real HIGH finding is never
      # retried away.
      run: |
        retry() { for i in 1 2 3; do "$@" && return 0; echo "install attempt $i failed; retrying in $((i*5))s"; sleep $((i*5)); done; return 1; }
        [ -x "$(go env GOPATH)/bin/gosec" ] || retry go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
        "$(go env GOPATH)/bin/gosec" -severity=high -quiet ./...

  build-and-push:
    needs: test
    if: github.repository_owner == 'zax0rz' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Check GITHUB_TOKEN can push packages
      id: check-token
      run: |
        # Verify we can actually authenticate before attempting the push
        TOKEN_OK=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/user" 2>/dev/null)
        if [ "$TOKEN_OK" = "200" ]; then
          echo "can_push=true" >> $GITHUB_OUTPUT
        else
          echo "can_push=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      if: steps.check-token.outputs.can_push == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: steps.check-token.outputs.can_push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      if: steps.check-token.outputs.can_push == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-

    - name: Build and push Docker image
      if: steps.check-token.outputs.can_push == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push AI Agent image
      if: steps.check-token.outputs.can_push == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.ai-agent
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-agent:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: |
      always() &&
      needs.build-and-push.result != 'failure' &&
      needs.build-and-push.result != 'cancelled' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Check KUBECONFIG secret exists
      id: check-kube
      run: |
        if [ -n "${{ secrets.KUBECONFIG }}" ]; then
          echo "KUBECONFIG is set"
          echo "skip=false" >> $GITHUB_OUTPUT
        else
          echo "KUBECONFIG not set — skipping deploy"
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Kubernetes
      if: steps.check-kube.outputs.skip != 'true'
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/postgres.yaml
        kubectl apply -f k8s/redis.yaml
        kubectl apply -f k8s/server.yaml
        kubectl apply -f k8s/ai-agent.yaml
        kubectl rollout status deployment/darkpawns-server -n darkpawns
        kubectl rollout status deployment/darkpawns-ai-agent -n darkpawns

    - name: Update deployment documentation
      if: steps.check-kube.outputs.skip != 'true'
      run: |
        echo "Deployment completed at $(date)" >> deployment/deployment-log.md
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add deployment/deployment-log.md
        git commit -m "Update deployment log" || echo "No changes to commit"
        git push || echo "Push failed (not critical)"
